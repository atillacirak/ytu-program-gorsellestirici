limit_req_zone $binary_remote_addr zone=ocr_heavy:10m rate=15r/m;
limit_req_zone $binary_remote_addr zone=api_general:10m rate=120r/m;

upstream ytu_backend {
    server 127.0.0.1:8001;
    keepalive 32;
}

upstream ytu_frontend {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name ytudostun.com www.ytudostun.com;

    # Yüksek çözünürlüklü PNG ve PDF yüklemeleri için 12MB sınır (413 hatasını önler)
    client_max_body_size 12M;

    # Gzip Sıkıştırma
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Güvenlik Başlıkları
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Ağır PDF / Görsel OCR Endpoint'leri için Rate Limit
    location ~ ^/api/(parse-student-schedule|parse-schedule-file|parse-transcript) {
        limit_req zone=ocr_heavy burst=8 nodelay;
        limit_req_status 429;

        proxy_pass http://ytu_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 45s;
    }

    location /api/ {
        limit_req zone=api_general burst=40 nodelay;

        proxy_pass http://ytu_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_next/static/ {
        proxy_pass http://ytu_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://ytu_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

